# Build + publish S0 vllm-metax image to GHCR (ADR-0015 Phase 0).
# Uses upstream docker/vllm_metax.Dockerfile; no MetaX Harbor login required.
# Runtime smoke still needs C550 — this job is CPU-only image build.

name: Build vLLM-MetaX image

on:
  workflow_dispatch:
    inputs:
      git_ref:
        description: Plugin source git ref (tag/branch/SHA)
        required: true
        default: v0.20.0
      vllm_version:
        description: VLLM_VERSION build-arg (pip vllm==…)
        required: true
        default: v0.20.0
      maca_version:
        description: MACA_VERSION build-arg
        required: true
        default: "3.7.0"
      push:
        description: Push image to GHCR
        type: boolean
        default: true

concurrency:
  group: build-image-${{ github.ref }}-${{ inputs.git_ref }}-${{ inputs.maca_version }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io

jobs:
  build:

    runs-on: self-hosted
    timeout-minutes: 360
    outputs:
      image: ${{ steps.meta.outputs.image }}
      digest: ${{ steps.build.outputs.digest }}
      tag: ${{ steps.meta.outputs.version_tag }}
    steps:
      - name: Free disk space
        run: |
          set -euo pipefail
          sudo rm -rf \
            /usr/share/dotnet \
            /usr/local/lib/android \
            /opt/ghc \
            /opt/hostedtoolcache/CodeQL \
            /usr/local/share/powershell \
            /usr/share/swift \
            /usr/local/.ghcup \
            || true
          sudo docker system prune -af || true
          df -h

      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Resolve plugin source ref
        id: ref
        run: |
          set -euo pipefail
          REF="${{ inputs.git_ref }}"
          if git cat-file -e "${REF}^{commit}" 2>/dev/null; then
            git checkout -f "${REF}"
          else
            echo "Ref ${REF} not in this repo; fetching from MetaX-MACA/vLLM-metax ..."
            git fetch --depth=1 https://github.com/MetaX-MACA/vLLM-metax.git \
              "+refs/tags/${REF}:refs/tags/${REF}" \
              || git fetch --depth=1 https://github.com/MetaX-MACA/vLLM-metax.git \
              "+refs/heads/${REF}:refs/remotes/upstream/${REF}"
            git checkout -f "${REF}"
          fi
          echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "short_sha=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
          echo "Building from $(git rev-parse HEAD) ($(git describe --tags --always))"

      - name: Image metadata
        id: meta
        run: |
          set -euo pipefail
          OWNER="$(echo "${GITHUB_REPOSITORY_OWNER}" | tr '[:upper:]' '[:lower:]')"
          IMAGE="${{ env.REGISTRY }}/${OWNER}/vllm-metax"
          VLLM_TAG="${{ inputs.vllm_version }}"
          VLLM_TAG="${VLLM_TAG#v}"
          VERSION_TAG="${VLLM_TAG}-maca${{ inputs.maca_version }}"
          SHA_TAG="sha-${{ steps.ref.outputs.short_sha }}"
          {
            echo "image=${IMAGE}"
            echo "version_tag=${VERSION_TAG}"
            echo "sha_tag=${SHA_TAG}"
            echo "tags<<EOF"
            echo "${IMAGE}:${VERSION_TAG}"
            echo "${IMAGE}:${SHA_TAG}"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
          echo "Image: ${IMAGE}:${VERSION_TAG} (+ ${SHA_TAG})"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: ${{ inputs.push }}
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/vllm_metax.Dockerfile
          push: ${{ inputs.push }}
          load: ${{ !inputs.push }}
          tags: ${{ steps.meta.outputs.tags }}
          build-args: |
            VLLM_VERSION=${{ inputs.vllm_version }}
            MACA_VERSION=${{ inputs.maca_version }}
          # Dockerfile uses RUN --mount=type=cache; GHA cache backend helps rebuilds.
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false

      - name: Summary
        if: always()
        run: |
          set -euo pipefail
          {
            echo "## vLLM-MetaX image build"
            echo ""
            echo "| Field | Value |"
            echo "|-------|-------|"
            echo "| git_ref | \`${{ inputs.git_ref }}\` |"
            echo "| commit | \`${{ steps.ref.outputs.commit }}\` |"
            echo "| VLLM_VERSION | \`${{ inputs.vllm_version }}\` |"
            echo "| MACA_VERSION | \`${{ inputs.maca_version }}\` |"
            echo "| image | \`${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.version_tag }}\` |"
            echo "| sha tag | \`${{ steps.meta.outputs.sha_tag }}\` |"
            echo "| digest | \`${{ steps.build.outputs.digest }}\` |"
            echo "| pushed | \`${{ inputs.push }}\` |"
            echo ""
            echo "Pin in mlnode-foundry:"
            echo "\`\`\`bash"
            echo "./tools/pin-stage0-metax.sh --tag '${{ steps.meta.outputs.version_tag }}'"
            echo "\`\`\`"
          } >> "$GITHUB_STEP_SUMMARY"
